name: pdfedtr
description: A cross-platform PDF editor built with Flutter. Works offline on Desktop, Android, and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^6.1.1
  pdf: ^3.10.7
  printing: ^5.12.0
  syncfusion_flutter_pdfviewer: ^24.1.41
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
